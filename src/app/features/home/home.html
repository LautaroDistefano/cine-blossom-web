<div class="home-contenedor">

  <section class="seccion seccion--destacadas">
    <h2>Películas destacadas</h2>
    <app-top-movies></app-top-movies>
  </section>

  <section class="seccion seccion--catalogo">
    <h2>Catálogo de películas</h2>

    <div class="buscadores">
      <app-movie-filter-genre></app-movie-filter-genre>
      <app-search-bar [(valor)]="filtroBarraBusqueda" />
    </div>

    <div class="catalogo-grid">
      @for (pelicula of peliculasFiltradas(); track pelicula.id) {
        <div class="catalogo-item">
          <app-movie-card [pelicula]="pelicula" />
          <button class="btn-detalle" (click)="verDetalles(pelicula.id)">
            Ver detalles
          </button>
        </div>
      }
    </div>
  </section>

</div>
