<article class="card" [class.card--top]="variant() === 'top'">
    <img [src]="pelicula().imagen">

    <div class="card-content">
        <h1>{{ pelicula().nombre }}</h1>

        @if (pelicula().restriccionEdad === null) {
            <p>ATP</p>
        } @else {
            <p>{{ pelicula().restriccionEdad }} años</p>
        }

        <div class="genres">
            @for (genero of pelicula().generos; track genero) {
                <span class="genre-tag">{{ genero }}</span>
            }
        </div>

        <div class="footer">
            <span>{{ pelicula().duracion }} min.</span>
            @if (cantidadReviews() > 0) {
                <span class="rating">⭐ {{ promedio() }}</span>
            } @else {
                <span class="rating sin-calificar">N/A</span>
            }
        </div>
    </div>
</article>
